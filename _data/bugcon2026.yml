  - uid: "0x02"
    type: talk
    slug: "magstripe-reload"
    time: "10:05 - 10:40"
    tag: MAGSTRIPE
    title: "Introducción a magstripe reload"
    speaker: "Adrián González"
    photo: "adrian.jpg"
    bio: "Ingeniero en Sistemas Computacionales y desarrollador de software, con experiencia en desarrollo backend, arquitectura de sistemas, infraestructura tecnológica y automatización de procesos. Apasionado por la ciberseguridad, la investigación en radiofrecuencia (RF), el desarrollo de hardware y las tecnologías emergentes. Me caracterizo por el aprendizaje continuo, la resolución de problemas complejos y la integración de conocimientos de distintas áreas para crear soluciones tecnológicas innovadoras, eficientes y seguras."
    abstract: "En esta sesesión se cubrira la exploración de la estructura y el procesamiento de datos de bandas magnéticas (Magstripe) mediante el desarrollo de un cliente web basado en Web Serial API. Se abordará la lectura, el parseo y el análisis de la información obtenida, identificando los datos presentes en las pistas magnéticas y evaluando, desde una perspectiva de seguridad, los riesgos asociados a su tratamiento en plataformas de pago. Mediante pruebas de concepto en entornos controlados, se analizarán posibles escenarios de exposición de información, validación insuficiente y abuso de flujos de compra, destacando la importancia de los controles implementados para prevenir el uso indebido de datos de pago."
    links:
      linkedin: "https://www.linkedin.com/in/adrian-g-7242a3124/"

  - uid: "0x03"
    type: talk
    slug: "dma-for-dummies"
    time: "10:40 - 11:25"
    tag: HARDWARE
    title: "DMA for dummy's"
    speaker: "Arnold Jared Morales Yepez"
    photo: "arnol.jpg"
    bio: "Desde los 12 años me he dedicado a la informática, con un enfoque especial en la seguridad. Ahora, a los 22, sigo explorando este mundo con la misma pasión, impulsado por la constante evolución de la tecnología y su infinita curva de aprendizaje. Tengo una licenciatura en Informática Forense y Ciberseguridad, y actualmente estoy realizando un máster en Inteligencia Artificial y Ciberseguridad."
    abstract: "Esta charla explora cómo el acceso directo a memoria (Direct Memory Access, DMA) se convirtió en una superficie crítica de ataque en cajeros automáticos. Se analizará por qué ocurrió este vector, cómo interactúa con el bus PCI/PCIe y dispositivos externos, y cómo puede utilizarse para evadir mecanismos tradicionales de protección como EDRs y controles de integridad del sistema. Desde una perspectiva técnica, se explicará cómo la ausencia o mala implementación de IOMMU, VT-d y configuraciones de firmware permiten el acceso arbitrario a memoria, y cómo esto impacta la confidencialidad, integridad y disponibilidad del sistema ATM. La sesión conecta hardware hacking con evasión avanzada, mostrando cómo el plano físico puede invalidar completamente los modelos de seguridad basados en software."
    links:
      linkedin: "https://www.linkedin.com/in/arnoldm19/"

  - uid: "0x04"
    type: talk
    slug: "janelarat"
    time: "11:25 - 12:25"
    tag: MALWARE
    title: "JanelaRAT, una familia de malware bancario evolucionando rápidamente con estilo latino"
    speaker: "Isabel Manjarrez"
    photo: "isabel.png"
    bio: "Senior security researcher en el Equipo Global de Investigación y Análisis (GReAT) de Kaspersky. Se especializa en la investigación de actores amenaza en Latinoamérica. Ingeniera en telecomunicaciones y sistemas electrónicos, sus intereses incluyen la inteligencia de amenazas, análisis de malware, comunicaciones satelitales, electrónica y música. Ha compartido su conocimiento como ponente en conferencias locales e internacionales como Defcon, Virus Bulletin, Security Analyst Summit (SAS) y EkoParty."
    abstract: "JanelaRAT surgió a finales de 2023 con el objetivo de atacar a usuarios de diversas instituciones financieras y plataformas de comercio de criptomonedas en América Latina. Este malware se ha unido al grupo de amenazas brasileñas que buscan información confidencial mediante el monitoreo del comportamiento del usuario. A pesar del poco tiempo transcurrido desde su aparición, ya existen numerosas variantes que presentan nuevas capacidades y se propagan a través de señuelos dirigidos a países específicos. Esta charla examinará las características y funcionalidades de JanelaRAT, destacando la evolución de la familia y los cambios en la implementación de esta operación en expansión. Hemos detectado versiones no documentadas que adaptan el ataque a países hispanohablantes concretos. Su rápida evolución ha dado lugar a múltiples versiones del malware; por ello, debemos estar preparados para futuras iteraciones que incorporen nuevas capacidades, incluso aquellas personalizadas para países específicos."
    links:
      linkedin: "https://www.linkedin.com/in/isabel-manjarrez-5007b0136/"

