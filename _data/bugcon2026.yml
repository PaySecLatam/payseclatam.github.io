  - uid: "0x06"
    type: talk
    slug: "windows-internals-atm"
    time: "14:30 - 15:15"
    tag: ATM_KERNEL
    title: "Windows Internals en ATMs: Kernel, Protecciones y Lógicas de Negocio"
    speaker: "Arnold Jared Morales Yepez"
    photo: "arnol.jpg"
    bio: "Desde los 12 años me he dedicado a la informática, con un enfoque especial en la seguridad. Ahora, a los 22, sigo explorando este mundo con la misma pasión, impulsado por la constante evolución de la tecnología y su infinita curva de aprendizaje. Tengo una licenciatura en Informática Forense y Ciberseguridad, y actualmente estoy realizando un máster en Inteligencia Artificial y Ciberseguridad."
    abstract: "Esta sesión aborda las protecciones internas del sistema operativo Windows en entornos ATM, enfocándose en el funcionamiento del kernel, el modelo de drivers, los mecanismos de aislamiento y las políticas de ejecución. Se examinarán componentes como el manejo de privilegios, protección de memoria, controladores XFS, servicios críticos y cómo la lógica de negocio del ATM interactúa con el sistema operativo. El objetivo es comprender qué protege realmente Windows en estos entornos, qué supuestos de seguridad existen y cómo ciertas debilidades en la implementación o configuración pueden permitir la manipulación de procesos críticos, bypass de restricciones o alteración del flujo operativo del cajero."
    links:
      linkedin: "https://www.linkedin.com/in/arnoldm19/"

  - uid: "0x07"
    type: talk
    slug: "atrium-plexus"
    time: "15:20 - 17:20"
    tag: WORKSHOP
    title: "ATRium + Plexus: de cero a tu primera mutación EMV"
    speaker: "Salvador Mendoza"
    photo: "salvador.jpg"
    bio: |
      Salvador Mendoza es investigador de seguridad especializado en sistemas de pago, seguridad de hardware, dispositivos embebidos, tokenización e investigación de seguridad ofensiva.

      Su investigación se centra en identificar vulnerabilidades en tecnologías de pago y sistemas embebidos, incluyendo NFC, RFID, MST, EMV con y sin contacto, y otras tecnologías relacionadas con pagos. Ha diseñado y desarrollado herramientas para pruebas de seguridad, ingeniería inversa y pentesting de sistemas de pago y procesos de tokenización.

      Salvador ha presentado su investigación en conferencias internacionales de seguridad como Black Hat USA, DEF CON, HITB, TROOPERS y otras, compartiendo hallazgos sobre seguridad en pagos, vulnerabilidades de tokenización y nuevas técnicas de ataque.

      Es autor del libro "Show me the (e-) money: Hacking a sistemas de pagos digitales: NFC, RFID, MST y Chips EMV", una publicación en español con una colección de investigaciones y ataques contra sistemas de pago digital.

      Su trabajo e intereses de investigación actuales incluyen seguridad de hardware, seguridad embebida, seguridad en pagos, EMV, ingeniería inversa, prevención del fraude e investigación de seguridad ofensiva.
    abstract: |
      ¿Qué sucede realmente cuando pagas con una tarjeta?

      En este workshop práctico de 2 horas exploraremos cómo funciona una transacción, desde la comunicación entre la tarjeta y la terminal mediante APDUs, hasta los mensajes ISO 8583 que llegan al banco emisor. Veremos qué información se intercambia, cómo se protege y dónde pueden existir riesgos de seguridad.

      Después pasaremos a la práctica con Atrium, una herramienta que permite interceptar, analizar y modificar comandos APDU en tiempo real. Finalmente, conoceremos Plexus, un entorno visual donde podrás construir y probar escenarios de seguridad, como ataques de relay, conectando nodos y observando su funcionamiento en vivo.

      Dos horas para entender qué ocurre detrás de un pago con tarjeta y cómo investigar su seguridad con herramientas reales.
    links:
      linkedin: "https://www.linkedin.com/in/salmg/"

