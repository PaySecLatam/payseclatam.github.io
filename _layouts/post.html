---
layout: default
---

<div class="post-container">
  <article class="post-body">
    <div class="post-header">
      <h1>{{ page.title }}</h1>
      <p class="post-meta-header">
        {% if page.author %}<span>{{ page.author }}</span> &mdash; {% endif %}
        <span>{{ page.date | date: "%d %B %Y" }}</span>
      </p>
      {% if page.tags %}
        <div class="tag-list">
          {% for tag in page.tags %}
            <span class="tag">{{ tag }}</span>
          {% endfor %}
        </div>
      {% endif %}
    </div>
    {{ content }}
  </article>
</div>
