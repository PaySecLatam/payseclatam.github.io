---
layout: default
---

<article class="post-container">

  <div style="margin-bottom: 2rem;">
    <a href="{{ site.baseurl }}/blog/" style="font-size: 0.82rem; color: var(--text-muted); text-decoration: none; letter-spacing: 0.04em;">← Blog</a>
  </div>

  <header class="post-header">
    {% if page.tags %}
      <div class="tag-list" style="margin-bottom: 0.75rem;">
        {% for tag in page.tags %}
          <span class="tag">{{ tag }}</span>
        {% endfor %}
      </div>
    {% endif %}
    <h1>{{ page.title }}</h1>
    <p class="post-meta-header">
      {% if page.author %}{{ page.author }}{% endif %}
      {% if page.author and page.date %} &mdash; {% endif %}
      {{ page.date | date: "%d %B %Y" }}
    </p>
  </header>

  <div class="post-body">
    {{ content }}
  </div>

</article>
